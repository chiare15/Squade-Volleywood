<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VolleyBalancer Pro - Google Drive Sync</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            volley: {
              navy: '#0f172a',
              blue: '#1e40af',
              lightBlue: '#3b82f6',
              orange: '#f97316',
              yellow: '#eab308',
              emerald: '#10b981',
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- HTML2PDF Library per export PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Navigation Bar -->
  <header class="bg-slate-900/90 border-b border-slate-800 shadow-xl sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-yellow-400 flex items-center justify-center shadow-lg shadow-orange-500/20 text-slate-950 font-black text-xl">
          <i class="fa-solid fa-volleyball"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            VolleyBalancer <span class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-semibold px-2 py-0.5 rounded-full">Drive Cloud</span>
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">Gestione giocatori e bilanciamento squadre sincronizzato su Google Drive</p>
        </div>
      </div>

      <!-- Main Navigation Tabs -->
      <nav class="flex items-center space-x-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
        <button id="nav-btn-generator" onclick="switchNavTab('generator')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 bg-orange-500 text-slate-950 shadow font-bold">
          <i class="fa-solid fa-users-viewfinder"></i> Generatore
        </button>
        <button id="nav-btn-history" onclick="switchNavTab('history')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-white">
          <i class="fa-solid fa-clock-rotate-left"></i> Storico Partite (<span id="history-count-badge">0</span>)
        </button>
        <button id="nav-btn-backup" onclick="switchNavTab('backup')" class="px-3 py-1.5 text-xs font-semibold rounded-lg transition-all flex items-center gap-2 text-slate-400 hover:text-white">
          <i class="fa-solid fa-database"></i> Backup &amp; DB
        </button>
      </nav>

      <!-- Quick actions -->
      <div class="flex items-center space-x-2">
        <button onclick="fetchDriveData()" class="px-2.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-blue-400 border border-blue-500/30 rounded-lg transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span class="hidden md:inline">Aggiorna</span>
        </button>
        <button onclick="loadSampleData(true)" class="px-2.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-orange-400 border border-orange-500/30 rounded-lg transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span class="hidden md:inline">Dati Prova</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- ==================== TAB 1: GENERATORE & GESTIONE GIOCATORI ==================== -->
    <div id="nav-tab-content-generator" class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Left Column: Input and Players List (5 Cols) -->
      <div class="lg:col-span-5 space-y-6">

        <!-- Input Box -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
          <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-user-plus text-orange-400"></i>
              <span>1. Importazione &amp; Input Giocatori</span>
            </h2>
          </div>

          <!-- Input Mode Tabs -->
          <div class="flex space-x-1 bg-slate-950 p-1 rounded-xl mb-4 border border-slate-800">
            <button id="input-btn-file" onclick="switchInputTab('file')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow">
              <i class="fa-solid fa-file-arrow-up"></i> Carica TXT
            </button>
            <button id="input-btn-manual" onclick="switchInputTab('manual')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
              <i class="fa-solid fa-file-lines"></i> Testo
            </button>
            <button id="input-btn-quick" onclick="switchInputTab('quick')" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
              <i class="fa-solid fa-plus"></i> Singolo
            </button>
          </div>

          <!-- Tab Content: File TXT -->
          <div id="input-content-file" class="space-y-3">
            <label for="txt-file-input" class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-slate-700 hover:border-orange-500 rounded-xl cursor-pointer bg-slate-950/50 hover:bg-slate-950 transition-all text-center p-3">
              <i class="fa-solid fa-file-import text-2xl text-slate-400 mb-1"></i>
              <span class="text-xs font-semibold text-slate-300">Trascina o clicca per caricare un file TXT/CSV</span>
              <span class="text-[10px] text-slate-500 mt-0.5">Esempio: "Marco Rossi, 8", "Giulia - 7.5", "Luca 6"</span>
              <input id="txt-file-input" type="file" accept=".txt,.csv" class="hidden" onchange="handleFileUpload(event)">
            </label>
          </div>

          <!-- Tab Content: Manual Text Area -->
          <div id="input-content-manual" class="space-y-3 hidden">
            <textarea id="raw-text-input" rows="5" placeholder="Incolla elenco qui, un giocatore per riga...&#10;Mario, 8&#10;Giulia - 7.5&#10;Luca Avanzato&#10;Paolo 5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-orange-500 font-mono custom-scrollbar"></textarea>
            <button onclick="parseRawText()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition-all shadow flex items-center justify-center gap-2">
              <i class="fa-solid fa-arrow-down-short-wide"></i> Est
